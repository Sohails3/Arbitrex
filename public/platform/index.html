<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved | Arbitrex</title>

    <!--
      /platform was the tool page before the site was split into one tab per
      tool. Its content now lives at /origination-engine/. A static export
      cannot issue a 301, so this stub keeps the old URL from dead-ending:
      the canonical tag passes ranking on, and the refresh moves people along.
      Delete it once nothing points at /platform any more.
    -->
    <link rel="canonical" href="https://arbitrex.co.uk/origination-engine/" />
    <meta http-equiv="refresh" content="0; url=/origination-engine/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b1220;
        color: #94a3b8;
        font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      a {
        color: #e0b568;
      }
    </style>
  </head>
  <body>
    <main>
      <p>This page has moved to the Private Equity Origination Engine.</p>
      <p><a href="/origination-engine/">Continue to /origination-engine/</a></p>
    </main>
  </body>
</html>
